<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>申请流程系统</title>
  <style>
    /* 全局重置 & 字体 */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f2f5;
      color: #333;
    }
    /* 导航 */
    .app-nav {
      background: #001529;
      padding: 0 40px;
      display: flex;
      align-items: center;
      height: 64px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-nav .logo {
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      margin-right: 40px;
      letter-spacing: 0.5px;
    }
    .app-nav a {
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 14px;
      padding: 0 16px;
      line-height: 64px;
      transition: color 0.3s;
    }
    .app-nav a:hover {
      color: #fff;
    }
    .app-nav a.active {
      color: #fff;
      border-bottom: 2px solid #1890ff;
    }
    /* 内容容器 */
    .app-container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <nav class="app-nav">
    <span class="logo">📋 申请系统</span>
    <a href="#list" class="active">申请列表</a>
    <a href="#create">发起申请</a>
    <a href="#stats">统计报表</a>
  </nav>
  <div id="app" class="app-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
